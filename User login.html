<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Page</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      background: #f4f6ff;
    }

    /* LEFT SIDE */
    .left {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: white;
    }

    .form-container {
      width: 320px;
    }

    .form-container h2 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    .form-container p {
      font-size: 14px;
      color: #666;
      margin-bottom: 20px;
    }

    .input-box {
      margin-bottom: 15px;
    }

    .input-box input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
    }

    .input-box input:focus {
      border-color: #5b6cff;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: #5b6cff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn:hover {
      background: #4455ff;
    }

    .links {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
    }

    .links a {
      text-decoration: none;
      color: #5b6cff;
    }

    /* RIGHT SIDE */
    .right {
      flex: 1;
      background: linear-gradient(135deg, #5b6cff, #3a3a7a);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 40px;
    }

    .right h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .right p {
      font-size: 16px;
      opacity: 0.9;
    }

    /* MOBILE */
    @media (max-width: 800px) {
      .right {
        display: none;
      }
      .left {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <!-- LEFT SIDE -->
  <div class="left">
    <div class="form-container">
      <h2>Welcome Back</h2>
      <p>Please login to your account</p>

      <form>
        <div class="input-box">
          <input type="email" placeholder="Email" required>
        </div>

        <div class="input-box">
          <input type="password" placeholder="Password" required>
        </div>

        <button class="btn" type="submit">Login</button>
      </form>

      <div class="links">
        <a href="#">Forgot Password?</a>
        <a href="#">Register</a>
      </div>
    </div>
  </div>

  <!-- RIGHT SIDE -->
  <div class="right">
    <div>
      <h1>Modern App</h1>
      <p>Secure login system built with clean design</p>
    </div>
  </div>

</body>
</html>
